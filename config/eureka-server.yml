# Configuracion del propio Eureka Server.
# NOTA: register-with-eureka y fetch-registry se sobreescriben a false
# porque Eureka no debe registrarse en si mismo.

server:
  port: 8761

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
